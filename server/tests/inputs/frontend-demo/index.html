<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Make it better</title><link rel="stylesheet" href="styles.css"></head>
<body><main class="page"><p class="eyebrow">VENTANA PRINCIPAL · DEMO</p><h1>Ingredientes de tu receta</h1><p>Después del parsing, pulsa <strong>Make it better</strong> para buscar la mejor mejora disponible.</p>
<table><thead><tr><th>#</th><th>Producto</th></tr></thead><tbody id="ingredient-rows"></tbody></table>
<div class="actions"><button id="make-better-button" class="primary">Make it better</button><button id="next-button" class="secondary">Next</button></div><p id="status" aria-live="polite"></p></main>
<dialog id="improvement-modal"><header><p class="eyebrow">MAKE IT BETTER</p><button id="close-button" class="close" aria-label="Cerrar">×</button></header><h2>¿Quieres hacer este cambio?</h2><p id="progress"></p>
<div class="bowls"><article class="original"><p>RECIPIENTE ORIGINAL</p><div class="bowl"><strong id="original-name"></strong><span id="original-scores"></span></div></article><article class="suggested"><p>RECIPIENTE SUGERIDO</p><div class="bowl"><strong id="suggested-name"></strong><span id="suggested-scores"></span></div></article></div>
<section><h3>Mejoras encontradas</h3><ul id="improvement-list"></ul></section><div id="choice-actions" class="actions"><button id="yes-button" class="primary">Sí</button><button id="no-button" class="secondary">No, mantener original</button></div><div id="switch-actions" class="actions" hidden><button id="switch-button" class="primary">Switch ingredient</button><button id="cancel-switch-button" class="secondary">No, mantener original</button></div></dialog><script src="app.js"></script></body></html>
